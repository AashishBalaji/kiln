# Kernel config fragment for the infotainment audio path.
#
# Enables the ASoC core, I2C bus, and the specific TI codec driver this
# project's kernel patch touches (sound/soc/codecs/tlv320aic31xx.c),
# plus the generic simple-audio-card machine driver used to bind a
# codec + CPU DAI without a board-specific machine driver -- the usual
# approach for a custom/embedded audio card in a Yocto BSP layer.
#
# These are real, correctly-spelled Kconfig symbols for this kernel
# tree (verified with grep against the actual `config` stanzas in
# sound/soc/codecs/Kconfig and sound/soc/generic/Kconfig in the same
# sparse checkout used for the patch -- the symbol is SND_SIMPLE_CARD,
# not the more guessable SND_SOC_SIMPLE_CARD).
CONFIG_SOUND=y
CONFIG_SND=y
CONFIG_SND_SOC=y
CONFIG_I2C=y

CONFIG_SND_SOC_TLV320AIC31XX=y
CONFIG_SND_SIMPLE_CARD=y
CONFIG_SND_SIMPLE_CARD_UTILS=y
