# meta-infotainment: a small custom BSP/application layer demonstrating
# Yocto recipe/layer authorship for an automotive-infotainment-style
# target -- a real third-party library recipe, a real custom service
# recipe that depends on it, and a custom image recipe.

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "infotainment"
BBFILE_PATTERN_infotainment = "^${LAYERDIR}/"
BBFILE_PRIORITY_infotainment = "6"

LAYERSERIES_COMPAT_infotainment = "scarthgap"

LAYERDEPENDS_infotainment = "core"
