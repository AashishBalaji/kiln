stages:
  - .pre
  - lint
  - test
  - yocto
  - .post
variables:
  PIP_BREAK_SYSTEM_PACKAGES: '1'
lint-triage-tool:
  stage: lint
  image:
    name: python:3.12-slim
  script:
    - pip install --quiet flake8
    - flake8 --max-line-length=100 triage-tool/bitbake_triage.py
lint-recipes:
  stage: lint
  image:
    name: python:3.12-slim
  script:
    - python3 ci/check_recipes.py
test-triage-tool:
  stage: test
  image:
    name: python:3.12-slim
  script:
    - pip install --quiet pytest
    - cd triage-tool && python3 -m pytest -v
yocto-parse:
  stage: yocto
  image:
    name: ubuntu:24.04
  when: manual
  script:
    - >-
      apt-get update -qq && apt-get install -y -qq git python3 locales chrpath
      diffstat cpio
    - locale-gen en_US.UTF-8 && update-locale LANG=en_US.UTF-8
    - export LANG=en_US.UTF-8 LC_ALL=en_US.UTF-8
    - useradd -m -s /bin/bash builder
    - >-
      git clone --depth 1 --branch scarthgap https://git.yoctoproject.org/poky
      /opt/poky
    - cp -r meta-infotainment /opt/
    - chown -R builder:builder /opt/poky /opt/meta-infotainment
    - >-
      su builder -c "cd /opt/poky && source oe-init-build-env build &&
      bitbake-layers add-layer /opt/meta-infotainment && bitbake -p"
yocto-build-cjson-native:
  stage: yocto
  image:
    name: ubuntu:24.04
  when: manual
  needs:
    - job: yocto-parse
      artifacts: true
      optional: false
  script:
    - export LANG=en_US.UTF-8 LC_ALL=en_US.UTF-8
    - >-
      su builder -c "cd /opt/poky && source oe-init-build-env build && bitbake
      cjson-native"
default: {}
